<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopee Cashback Admin</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--text:#172033;--muted:#667085;--brand:#ee4d2d;--ok:#067647;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1220px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
h1,h2{margin:0 0 12px}.muted{color:var(--muted)}input,button,select{font:inherit}input{padding:11px 12px;border:1px solid var(--line);border-radius:10px}
button{padding:11px 14px;border:0;border-radius:10px;cursor:pointer}.primary{background:var(--brand);color:#fff;font-weight:700}
.secondary{background:#fff;border:1px solid var(--line)}.hidden{display:none!important}table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#fafafa}.scroll{overflow:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.good{color:var(--ok)}.bad{color:var(--bad)}code{font-size:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
  <div id="loginBox" class="card">
    <h1>Admin Production</h1>
    <p class="muted">Đăng nhập bằng tài khoản đã được đặt <code>role = admin</code> trong Supabase.</p>
    <div class="row">
      <input id="adminUsername" placeholder="Tên đăng nhập">
      <input id="adminPassword" type="password" placeholder="Mật khẩu">
      <button class="primary" id="adminLoginBtn">Đăng nhập</button>
    </div>
    <div id="loginError" class="bad" style="margin-top:10px"></div>
  </div>

  <div id="adminApp" class="hidden">
    <div class="row" style="justify-content:space-between;margin-bottom:18px">
      <div><h1>Quản trị Shopee Cashback</h1><div id="adminWho" class="muted"></div></div>
      <button class="secondary" id="logoutBtn">Đăng xuất</button>
    </div>

    <section class="card">
      <h2>Import Báo cáo chuyển đổi Shopee</h2>
      <p class="muted">Upload CSV/XLSX. Cùng một Order ID upload lại sẽ được cập nhật, không tạo trùng.</p>
      <div class="row">
        <input id="reportFile" type="file" accept=".csv,.xlsx,.xls">
        <button class="primary" id="importBtn">Import báo cáo</button>
      </div>
      <div id="importResult" class="muted" style="margin-top:10px"></div>
    </section>

    <section class="card">
      <h2>Tài khoản</h2>
      <div id="usersBox"></div>
    </section>

    <section class="card">
      <h2>Đơn hàng đã import</h2>
      <div id="ordersBox"></div>
    </section>
  </div>
</div>

<script>
const SUPABASE_URL="https://jqzyytgzgpjpgbtuirmn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_ANZU3Mus2Xag_qg9xQ2qNw_BqPgrMhv";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let profiles=[],tiers=[];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ');
const cleanSub=s=>String(s||'').trim().replace(/-+$/,'');

function internalEmail(username){
  return String(username||'').trim().toLowerCase()+'@users.shopee-cashback.example.com';
}
function pick(row,names){
  const es=Object.entries(row||{});
  for(const n of names){
    const f=es.find(([k])=>norm(k)===norm(n)); if(f)return f[1];
  }
  for(const n of names){
    const f=es.find(([k])=>norm(k).includes(norm(n))); if(f)return f[1];
  }
  return '';
}
function money(v){
  if(typeof v==='number')return Number.isFinite(v)?v:0;
  const s=String(v??'').replace(/[^0-9,.-]/g,'');
  if(!s)return 0;
  if(/^\d{1,3}([.,]\d{3})+$/.test(s))return Number(s.replace(/[.,]/g,''));
  return Number(s.replace(/,/g,''))||0;
}
function invalidStatus(s){
  const n=norm(s); return n.includes('khong hop le')||n.includes('invalid')||n.includes('huy');
}
function confirmedStatus(s){
  const n=norm(s); return n.includes('da xac nhan')||n.includes('confirmed')||n.includes('hoan thanh')||n.includes('thanh cong');
}

async function requireAdmin(){
  const {data}=await sb.auth.getSession();
  const user=data?.session?.user;
  if(!user)return null;
  const {data:p}=await sb.from('profiles').select('id,username,display_name,role,is_locked').eq('id',user.id).maybeSingle();
  if(!p||p.role!=='admin'||p.is_locked){await sb.auth.signOut();return null}
  return p;
}

async function login(){
  $('#loginError').textContent='';
  const u=$('#adminUsername').value.trim().toLowerCase();
  const p=$('#adminPassword').value;
  const {error}=await sb.auth.signInWithPassword({email:internalEmail(u),password:p});
  if(error){$('#loginError').textContent='Tên đăng nhập hoặc mật khẩu không đúng.';return}
  const admin=await requireAdmin();
  if(!admin){$('#loginError').textContent='Tài khoản này không có quyền Admin.';return}
  await showApp(admin);
}

async function showApp(admin){
  $('#loginBox').classList.add('hidden'); $('#adminApp').classList.remove('hidden');
  $('#adminWho').textContent=admin.display_name+' · '+admin.username;
  await loadData();
}
async function loadData(){
  const [pRes,tRes,oRes]=await Promise.all([
    sb.from('profiles').select('id,username,display_name,tracking_code,role,is_locked,created_at').order('created_at',{ascending:false}),
    sb.from('cashback_tiers').select('*').order('sort_order'),
    sb.from('orders').select('*').order('updated_at',{ascending:false}).limit(500)
  ]);
  if(pRes.error)throw pRes.error;
  profiles=pRes.data||[]; tiers=tRes.data||[];
  renderUsers();
  renderOrders(oRes.data||[],oRes.error);
}

function renderUsers(){
  $('#usersBox').innerHTML='<div class="scroll"><table><thead><tr><th>Tên</th><th>Username</th><th>Tracking/Sub ID</th><th>Role</th><th>Trạng thái</th></tr></thead><tbody>'+
  profiles.map(p=>`<tr><td>${esc(p.display_name)}</td><td>${esc(p.username)}</td><td><b>${esc(p.tracking_code||'—')}</b></td><td>${esc(p.role)}</td><td>${p.is_locked?'Đã khóa':'Hoạt động'}</td></tr>`).join('')+
  '</tbody></table></div>';
}
function renderOrders(rows,error){
  if(error){$('#ordersBox').innerHTML='<div class="bad">'+esc(error.message)+'</div>';return}
  if(!rows.length){$('#ordersBox').innerHTML='<div class="muted">Chưa có đơn.</div>';return}
  $('#ordersBox').innerHTML='<div class="scroll"><table><thead><tr><th>Order ID</th><th>User</th><th>Sản phẩm</th><th>Hoa hồng Shopee</th><th>Cashback</th><th>Trạng thái</th></tr></thead><tbody>'+
  rows.map(o=>{const p=profiles.find(x=>x.id===o.user_id);return `<tr><td>${esc(o.order_id)}</td><td>${esc(p?.display_name||o.user_id)}</td><td>${esc(o.product_name||'—')}</td><td>${Number(o.shopee_commission||0).toLocaleString('vi-VN')}đ</td><td><b>${Number(o.cashback_amount||0).toLocaleString('vi-VN')}đ</b></td><td>${esc(o.normalized_status)}</td></tr>`}).join('')+
  '</tbody></table></div>';
}

async function rateForUser(userId){
  const {data:sum,error}=await sb.rpc('confirmed_cashback_for_user',{target_user:userId});
  if(error)throw error;
  const total=Number(sum||0);
  const eligible=[...tiers].filter(t=>total>=Number(t.min_confirmed_cashback||0)).sort((a,b)=>Number(b.min_confirmed_cashback)-Number(a.min_confirmed_cashback));
  return Number(eligible[0]?.cashback_rate ?? 0.60);
}

function parseRow(row){
  const orderId=String(pick(row,['Order id','Order ID','Mã đơn hàng','ID đơn hàng'])||'').trim();
  const subId=cleanSub(pick(row,['Sub_id','Sub id','Sub ID','sub_id']));
  const productName=String(pick(row,['Tên sản phẩm','Thông tin sản phẩm','Product Name'])||'').trim();
  const shopName=String(pick(row,['Tên Shop','Tên shop','Shop Name','Thông tin cửa hàng'])||'').trim();
  const orderValue=money(pick(row,['Giá trị đơn hàng','Order Value']));
  const productCommission=money(pick(row,['Hoa hồng sản phẩm','Product Commission']));
  const orderCommission=money(pick(row,['Hoa hồng đơn hàng','Order Commission']));
  const xtraCommission=money(pick(row,['Hoa hồng Xtra','Xtra Commission']));
  const commission=Math.max(0,productCommission+orderCommission+xtraCommission);
  const orderStatus=String(pick(row,['Trạng thái đơn hàng','Order Status'])||'').trim();
  const commissionStatus=String(pick(row,['Trạng thái hoa hồng','Commission Status','Trạng thái ghi nhận'])||'').trim();
  const orderedAt=pick(row,['Thời Gian Đặt Hàng','Thời gian đặt hàng','Order Time']);
  return {orderId,subId,productName,shopName,orderValue,commission,orderStatus,commissionStatus,orderedAt};
}

async function importReport(){
  const file=$('#reportFile').files?.[0]; if(!file)return alert('Chọn file báo cáo trước.');
  $('#importResult').textContent='Đang xử lý...';
  try{
    if(!profiles.length||!tiers.length)await loadData();
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    let matched=0,unmatched=0,skipped=0;

    for(const raw of rows){
      const r=parseRow(raw);
      if(!r.orderId){skipped++;continue}
      const p=profiles.find(x=>cleanSub(x.tracking_code)===r.subId);
      if(!p){unmatched++;continue}

      const rate=await rateForUser(p.id);
      const normalized=invalidStatus(r.commissionStatus)?'invalid':confirmedStatus(r.commissionStatus)?'confirmed':'pending';
      const cashback=normalized==='invalid'?0:Math.round(r.commission*rate);

      const payload={
        order_id:r.orderId,user_id:p.id,sub_id:r.subId,product_name:r.productName,shop_name:r.shopName,
        order_value:r.orderValue,shopee_commission:r.commission,cashback_rate:rate,cashback_amount:cashback,
        order_status:r.orderStatus,commission_status:r.commissionStatus,normalized_status:normalized,
        source_imported_at:new Date().toISOString(),updated_at:new Date().toISOString()
      };
      if(r.orderedAt)payload.ordered_at=new Date(r.orderedAt).toISOString();

      const {error}=await sb.from('orders').upsert(payload,{onConflict:'order_id'});
      if(error)throw error;
      matched++;
    }

    $('#importResult').innerHTML=`Đọc ${rows.length} dòng · cập nhật ${matched} đơn · không tìm thấy Sub ID ${unmatched} · bỏ qua ${skipped}.`;
    await loadData();
  }catch(e){
    $('#importResult').textContent='Import lỗi: '+(e.message||e);
  }
}

$('#adminLoginBtn').onclick=login;
$('#importBtn').onclick=importReport;
$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};

(async()=>{
  const a=await requireAdmin();
  if(a)await showApp(a);
})();
</script>
</body>
</html>
